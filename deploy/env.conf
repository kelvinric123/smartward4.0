# =============================================================================
# SmartWard Deployment Configuration
# Modify these values before running install.sh
# =============================================================================

# Application Settings
APP_NAME="smartward"
APP_DIR="/var/www/smartward"
APP_USER="www-data"
APP_GROUP="www-data"
APP_PORT="80"

# PHP Settings
PHP_VERSION="8.2"
SWOOLE_VERSION="5.1.1"

# Node.js Settings
NODE_VERSION="20"

# MySQL/MariaDB Settings
MYSQL_ROOT_PASSWORD="smartward_secret"
DB_NAME="smartward"
DB_USER="smartward"
DB_PASSWORD="smartward_secret"

# Redis Settings
REDIS_PASSWORD=""
REDIS_MAXMEMORY="256mb"

# Octane Settings
OCTANE_WORKERS="auto"
OCTANE_TASK_WORKERS="auto"
OCTANE_MAX_REQUESTS="1000"

# SSL Settings (for nginx reverse proxy)
SSL_ENABLED="false"
SSL_CERT_PATH=""
SSL_KEY_PATH=""

# Git Repository (optional - for auto clone)
GIT_REPO=""
GIT_BRANCH="main"



