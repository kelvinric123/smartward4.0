<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'">
  <title>SmartWard 4.0</title>
  <style>
    /* ===== CSS Variables ===== */
    :root {
      --bg-primary: #0a0a0f;
      --bg-secondary: #12121a;
      --bg-tertiary: #1a1a24;
      --bg-card: #16161f;
      --bg-hover: #1e1e2a;
      
      --accent-primary: #00d4aa;
      --accent-secondary: #00a88a;
      --accent-glow: rgba(0, 212, 170, 0.15);
      --accent-glow-strong: rgba(0, 212, 170, 0.3);
      
      --text-primary: #ffffff;
      --text-secondary: #a0a0b0;
      --text-muted: #6a6a7a;
      
      --status-running: #00d4aa;
      --status-stopped: #ff6b6b;
      --status-warning: #ffd93d;
      --status-starting: #4dabf7;
      
      --border-color: #2a2a36;
      --border-glow: rgba(0, 212, 170, 0.4);
      
      --font-main: 'Segoe UI', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      --font-mono: 'Cascadia Code', 'Fira Code', 'Consolas', monospace;
      
      --radius-sm: 6px;
      --radius-md: 10px;
      --radius-lg: 14px;
      
      --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.3);
      --shadow-md: 0 4px 20px rgba(0, 0, 0, 0.4);
      --shadow-glow: 0 0 30px var(--accent-glow);
    }

    /* ===== Reset & Base ===== */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: var(--font-main);
      background: var(--bg-primary);
      color: var(--text-primary);
      overflow: hidden;
      user-select: none;
      height: 100vh;
    }

    /* ===== Title Bar ===== */
    .titlebar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 36px;
      background: var(--bg-secondary);
      border-bottom: 1px solid var(--border-color);
      -webkit-app-region: drag;
      padding: 0 12px;
    }

    .titlebar-title {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 13px;
      font-weight: 500;
      color: var(--text-secondary);
    }

    .titlebar-icon {
      width: 18px;
      height: 18px;
      background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      color: var(--bg-primary);
      font-weight: bold;
    }

    .titlebar-controls {
      display: flex;
      -webkit-app-region: no-drag;
    }

    .titlebar-btn {
      width: 46px;
      height: 36px;
      border: none;
      background: transparent;
      color: var(--text-secondary);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s ease;
    }

    .titlebar-btn:hover {
      background: var(--bg-hover);
      color: var(--text-primary);
    }

    .titlebar-btn.close:hover {
      background: #e81123;
      color: white;
    }

    .titlebar-btn svg {
      width: 10px;
      height: 10px;
    }

    /* ===== Main Container ===== */
    .container {
      display: flex;
      flex-direction: column;
      height: calc(100vh - 36px);
      padding: 24px;
      gap: 20px;
      overflow-y: auto;
    }

    /* ===== Header Section ===== */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .logo {
      width: 56px;
      height: 56px;
      background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
      border-radius: var(--radius-md);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: var(--shadow-glow);
    }

    .logo svg {
      width: 32px;
      height: 32px;
      fill: var(--bg-primary);
    }

    .brand-text h1 {
      font-size: 24px;
      font-weight: 600;
      letter-spacing: -0.5px;
    }

    .brand-text p {
      font-size: 13px;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .version-badge {
      background: var(--accent-glow);
      color: var(--accent-primary);
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 600;
      border: 1px solid var(--accent-secondary);
    }

    /* ===== Status Card ===== */
    .status-card {
      background: var(--bg-card);
      border-radius: var(--radius-lg);
      border: 1px solid var(--border-color);
      padding: 24px;
      position: relative;
      overflow: hidden;
    }

    .status-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: linear-gradient(90deg, var(--status-stopped), var(--status-stopped));
      transition: background 0.3s ease;
    }

    .status-card.running::before {
      background: linear-gradient(90deg, var(--status-running), var(--accent-secondary));
    }

    .status-card.starting::before {
      background: linear-gradient(90deg, var(--status-starting), var(--status-warning));
      animation: pulse 1.5s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    .status-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
    }

    .status-indicator {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .status-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--status-stopped);
      box-shadow: 0 0 12px var(--status-stopped);
      transition: all 0.3s ease;
    }

    .status-dot.running {
      background: var(--status-running);
      box-shadow: 0 0 12px var(--status-running);
    }

    .status-dot.starting {
      background: var(--status-starting);
      box-shadow: 0 0 12px var(--status-starting);
      animation: pulse 1s ease-in-out infinite;
    }

    .status-text {
      font-size: 18px;
      font-weight: 600;
    }

    .status-message {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 4px;
    }

    /* ===== Stats Grid ===== */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
    }

    .stat-item {
      background: var(--bg-tertiary);
      border-radius: var(--radius-md);
      padding: 16px;
      text-align: center;
    }

    .stat-label {
      font-size: 11px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
    }

    .stat-value {
      font-size: 18px;
      font-weight: 600;
      font-family: var(--font-mono);
      color: var(--accent-primary);
    }

    /* ===== Action Buttons ===== */
    .actions {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
    }

    .btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 20px;
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      background: var(--bg-card);
      color: var(--text-primary);
      cursor: pointer;
      transition: all 0.2s ease;
      font-family: inherit;
    }

    .btn:hover:not(:disabled) {
      background: var(--bg-hover);
      border-color: var(--accent-primary);
      transform: translateY(-2px);
      box-shadow: var(--shadow-md);
    }

    .btn:active:not(:disabled) {
      transform: translateY(0);
    }

    .btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .btn svg {
      width: 24px;
      height: 24px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
    }

    .btn-label {
      font-size: 12px;
      font-weight: 500;
    }

    .btn.primary {
      background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
      border-color: transparent;
      color: var(--bg-primary);
    }

    .btn.primary:hover:not(:disabled) {
      box-shadow: var(--shadow-glow);
      transform: translateY(-2px);
    }

    .btn.danger:hover:not(:disabled) {
      border-color: var(--status-stopped);
      color: var(--status-stopped);
    }

    /* ===== Logs Section ===== */
    .logs-section {
      flex: 1;
      min-height: 200px;
      display: flex;
      flex-direction: column;
      background: var(--bg-card);
      border-radius: var(--radius-lg);
      border: 1px solid var(--border-color);
      overflow: hidden;
    }

    .logs-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 18px;
      background: var(--bg-tertiary);
      border-bottom: 1px solid var(--border-color);
    }

    .logs-title {
      font-size: 13px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .logs-title svg {
      width: 16px;
      height: 16px;
      stroke: var(--accent-primary);
    }

    .logs-actions {
      display: flex;
      gap: 8px;
    }

    .logs-btn {
      padding: 6px 12px;
      border: 1px solid var(--border-color);
      border-radius: var(--radius-sm);
      background: var(--bg-secondary);
      color: var(--text-secondary);
      font-size: 11px;
      font-family: inherit;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .logs-btn:hover {
      background: var(--bg-hover);
      border-color: var(--accent-primary);
      color: var(--text-primary);
    }

    .logs-content {
      flex: 1;
      padding: 14px 18px;
      overflow-y: auto;
      font-family: var(--font-mono);
      font-size: 11px;
      line-height: 1.6;
      color: var(--text-secondary);
      white-space: pre-wrap;
      word-break: break-all;
    }

    .logs-content::-webkit-scrollbar {
      width: 8px;
    }

    .logs-content::-webkit-scrollbar-track {
      background: var(--bg-tertiary);
    }

    .logs-content::-webkit-scrollbar-thumb {
      background: var(--border-color);
      border-radius: 4px;
    }

    .logs-content::-webkit-scrollbar-thumb:hover {
      background: var(--text-muted);
    }

    /* ===== Docker Warning ===== */
    .docker-warning {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(10, 10, 15, 0.95);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
    }

    .docker-warning.hidden {
      display: none;
    }

    .warning-content {
      text-align: center;
      max-width: 400px;
      padding: 40px;
    }

    .warning-icon {
      width: 80px;
      height: 80px;
      margin: 0 auto 24px;
      background: rgba(255, 107, 107, 0.1);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .warning-icon svg {
      width: 40px;
      height: 40px;
      stroke: var(--status-stopped);
    }

    .warning-title {
      font-size: 22px;
      font-weight: 600;
      margin-bottom: 12px;
    }

    .warning-text {
      color: var(--text-secondary);
      line-height: 1.6;
      margin-bottom: 24px;
    }

    .warning-btn {
      padding: 12px 28px;
      background: var(--accent-primary);
      border: none;
      border-radius: var(--radius-md);
      color: var(--bg-primary);
      font-size: 14px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .warning-btn:hover {
      transform: scale(1.05);
      box-shadow: var(--shadow-glow);
    }

    /* ===== Settings Modal ===== */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(10, 10, 15, 0.85);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 200;
      opacity: 0;
      visibility: hidden;
      transition: all 0.2s ease;
    }

    .modal-overlay.visible {
      opacity: 1;
      visibility: visible;
    }

    .modal {
      background: var(--bg-card);
      border-radius: var(--radius-lg);
      border: 1px solid var(--border-color);
      width: 420px;
      max-height: 80vh;
      overflow: hidden;
      transform: scale(0.95);
      transition: transform 0.2s ease;
    }

    .modal-overlay.visible .modal {
      transform: scale(1);
    }

    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 20px 24px;
      border-bottom: 1px solid var(--border-color);
    }

    .modal-title {
      font-size: 18px;
      font-weight: 600;
    }

    .modal-close {
      width: 32px;
      height: 32px;
      border: none;
      background: var(--bg-tertiary);
      border-radius: var(--radius-sm);
      color: var(--text-secondary);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s ease;
    }

    .modal-close:hover {
      background: var(--bg-hover);
      color: var(--text-primary);
    }

    .modal-body {
      padding: 24px;
    }

    .setting-group {
      margin-bottom: 20px;
    }

    .setting-group:last-child {
      margin-bottom: 0;
    }

    .setting-label {
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
    }

    .setting-info {
      flex: 1;
    }

    .setting-name {
      font-size: 14px;
      font-weight: 500;
      margin-bottom: 4px;
    }

    .setting-desc {
      font-size: 12px;
      color: var(--text-muted);
    }

    /* Toggle Switch */
    .toggle {
      position: relative;
      width: 44px;
      height: 24px;
      background: var(--bg-tertiary);
      border-radius: 12px;
      transition: all 0.2s ease;
    }

    .toggle::after {
      content: '';
      position: absolute;
      top: 3px;
      left: 3px;
      width: 18px;
      height: 18px;
      background: var(--text-muted);
      border-radius: 50%;
      transition: all 0.2s ease;
    }

    .setting-label input {
      display: none;
    }

    .setting-label input:checked + .toggle {
      background: var(--accent-primary);
    }

    .setting-label input:checked + .toggle::after {
      left: 23px;
      background: var(--bg-primary);
    }

    .modal-footer {
      display: flex;
      justify-content: flex-end;
      gap: 12px;
      padding: 16px 24px;
      border-top: 1px solid var(--border-color);
      background: var(--bg-tertiary);
    }

    .modal-btn {
      padding: 10px 20px;
      border-radius: var(--radius-sm);
      font-size: 13px;
      font-weight: 500;
      font-family: inherit;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .modal-btn.secondary {
      background: transparent;
      border: 1px solid var(--border-color);
      color: var(--text-secondary);
    }

    .modal-btn.secondary:hover {
      background: var(--bg-hover);
      color: var(--text-primary);
    }

    .modal-btn.primary {
      background: var(--accent-primary);
      border: none;
      color: var(--bg-primary);
    }

    .modal-btn.primary:hover {
      background: var(--accent-secondary);
    }

    /* ===== Loading States ===== */
    .loading {
      opacity: 0.6;
      pointer-events: none;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .spinner {
      animation: spin 1s linear infinite;
    }
  </style>
</head>
<body>
  <!-- Title Bar -->
  <div class="titlebar">
    <div class="titlebar-title">
      <div class="titlebar-icon">SW</div>
      <span>SmartWard 4.0</span>
    </div>
    <div class="titlebar-controls">
      <button class="titlebar-btn" id="btn-minimize">
        <svg viewBox="0 0 10 1"><rect width="10" height="1" fill="currentColor"/></svg>
      </button>
      <button class="titlebar-btn" id="btn-maximize">
        <svg viewBox="0 0 10 10"><rect x="0.5" y="0.5" width="9" height="9" stroke="currentColor" fill="none"/></svg>
      </button>
      <button class="titlebar-btn close" id="btn-close">
        <svg viewBox="0 0 10 10"><path d="M1,1 L9,9 M9,1 L1,9" stroke="currentColor" stroke-width="1.2"/></svg>
      </button>
    </div>
  </div>

  <!-- Main Container -->
  <div class="container">
    <!-- Header -->
    <div class="header">
      <div class="brand">
        <div class="logo">
          <svg viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
        </div>
        <div class="brand-text">
          <h1>SmartWard</h1>
          <p>Healthcare Management System</p>
        </div>
      </div>
      <span class="version-badge">v4.0.0</span>
    </div>

    <!-- Status Card -->
    <div class="status-card" id="status-card">
      <div class="status-header">
        <div class="status-indicator">
          <div class="status-dot" id="status-dot"></div>
          <div>
            <div class="status-text" id="status-text">Checking...</div>
            <div class="status-message" id="status-message">Connecting to Docker</div>
          </div>
        </div>
      </div>
      <div class="stats-grid">
        <div class="stat-item">
          <div class="stat-label">CPU Usage</div>
          <div class="stat-value" id="stat-cpu">-</div>
        </div>
        <div class="stat-item">
          <div class="stat-label">Memory</div>
          <div class="stat-value" id="stat-memory">-</div>
        </div>
        <div class="stat-item">
          <div class="stat-label">Network I/O</div>
          <div class="stat-value" id="stat-network">-</div>
        </div>
      </div>
    </div>

    <!-- Action Buttons -->
    <div class="actions">
      <button class="btn primary" id="btn-start">
        <svg viewBox="0 0 24 24"><polygon points="5,3 19,12 5,21"/></svg>
        <span class="btn-label">Start</span>
      </button>
      <button class="btn danger" id="btn-stop">
        <svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="2"/></svg>
        <span class="btn-label">Stop</span>
      </button>
      <button class="btn" id="btn-restart">
        <svg viewBox="0 0 24 24"><path d="M23 4v6h-6M1 20v-6h6"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
        <span class="btn-label">Restart</span>
      </button>
      <button class="btn" id="btn-open">
        <svg viewBox="0 0 24 24"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15,3 21,3 21,9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
        <span class="btn-label">Open App</span>
      </button>
    </div>

    <!-- Secondary Actions -->
    <div class="actions">
      <button class="btn" id="btn-rebuild">
        <svg viewBox="0 0 24 24"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27,6.96 12,12.01 20.73,6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></svg>
        <span class="btn-label">Rebuild</span>
      </button>
      <button class="btn" id="btn-logs-folder">
        <svg viewBox="0 0 24 24"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
        <span class="btn-label">Logs Folder</span>
      </button>
      <button class="btn" id="btn-settings">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        <span class="btn-label">Settings</span>
      </button>
      <div></div>
    </div>

    <!-- Logs Section -->
    <div class="logs-section">
      <div class="logs-header">
        <div class="logs-title">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14,2 14,8 20,8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10,9 9,9 8,9"/></svg>
          Container Logs
        </div>
        <div class="logs-actions">
          <button class="logs-btn" id="btn-refresh-logs">Refresh</button>
          <button class="logs-btn" id="btn-clear-logs">Clear</button>
        </div>
      </div>
      <div class="logs-content" id="logs-content">Waiting for container...</div>
    </div>
  </div>

  <!-- Docker Warning Overlay -->
  <div class="docker-warning hidden" id="docker-warning">
    <div class="warning-content">
      <div class="warning-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
      </div>
      <h2 class="warning-title">Docker Not Available</h2>
      <p class="warning-text" id="docker-warning-text">Docker Desktop is not running. Please start Docker Desktop and try again.</p>
      <button class="warning-btn" id="btn-retry-docker">Retry Connection</button>
    </div>
  </div>

  <!-- Settings Modal -->
  <div class="modal-overlay" id="settings-modal">
    <div class="modal">
      <div class="modal-header">
        <h3 class="modal-title">Settings</h3>
        <button class="modal-close" id="btn-close-settings">
          <svg width="12" height="12" viewBox="0 0 10 10"><path d="M1,1 L9,9 M9,1 L1,9" stroke="currentColor" stroke-width="1.5"/></svg>
        </button>
      </div>
      <div class="modal-body">
        <div class="setting-group">
          <label class="setting-label">
            <div class="setting-info">
              <div class="setting-name">Start with Windows</div>
              <div class="setting-desc">Launch SmartWard automatically at startup</div>
            </div>
            <input type="checkbox" id="setting-autostart">
            <span class="toggle"></span>
          </label>
        </div>
        <div class="setting-group">
          <label class="setting-label">
            <div class="setting-info">
              <div class="setting-name">Minimize to Tray</div>
              <div class="setting-desc">Keep running in system tray when closed</div>
            </div>
            <input type="checkbox" id="setting-tray" checked>
            <span class="toggle"></span>
          </label>
        </div>
        <div class="setting-group">
          <label class="setting-label">
            <div class="setting-info">
              <div class="setting-name">Start Minimized</div>
              <div class="setting-desc">Start in system tray instead of main window</div>
            </div>
            <input type="checkbox" id="setting-minimized">
            <span class="toggle"></span>
          </label>
        </div>
      </div>
      <div class="modal-footer">
        <button class="modal-btn secondary" id="btn-cancel-settings">Cancel</button>
        <button class="modal-btn primary" id="btn-save-settings">Save Changes</button>
      </div>
    </div>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
