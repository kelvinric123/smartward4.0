# =============================================================================
# Smartward Firewall Configuration
# =============================================================================
# This config covers ALL services from docker_swoole/docker-compose.yml
# and the separate Seekink E-Ink deployment.

# -----------------------------------------------
# Hospital Network (Non-Standard Subnets)
# -----------------------------------------------
# The Docker-UFW bypass only allows standard private ranges (10.x, 172.x, 192.168.x)
# by default. If the hospital uses any non-standard internal subnets, list them here
# (space-separated) so they are also allowed through to Docker containers.
# Example: "133.133.0.0/16 100.64.0.0/10"
HOSPITAL_VLANS="133.133.0.0/16"

# -----------------------------------------------
# Server Administration
# -----------------------------------------------
# Change 'any' to your IT department's IP/subnet (e.g., 10.21.20.0/24) to lock down SSH
ADMIN_IP="any"
SSH_PORT="22"

# -----------------------------------------------
# Web Traffic (Smartward UI)
# -----------------------------------------------
# Port 80  = HTTP (redirects to HTTPS via Nginx)
# Port 443 = HTTPS (main Smartward UI)
WEB_PORTS="80 443"

# -----------------------------------------------
# Medical Device Integration Ports
# -----------------------------------------------
# Port 3000 = HL7 ADT Listener (Patient Admission/Discharge/Transfer)
# Port 3050 = ECG HTTP Upload Server
# Port 5001 = B.Braun Infusion Pump HL7 Listener
HL7_PORT="3000"
ECG_PORT="3050"
BBRAUN_PORT="5001"

# Medical Device Subnet (VLAN)
# Change 'any' to your hospital's medical device subnet (e.g., 10.50.0.0/16) 
# to ensure ONLY medical devices can send data to these ports.
MEDICAL_VLAN="any"

# -----------------------------------------------
# LDAP Sync Service
# -----------------------------------------------
# Port 5000 = LDAP Sync Flask API
# Set to 'true' if another external server triggers the LDAP sync.
# Set to 'false' if only containers on the Docker network call it (safer).
LDAP_EXTERNAL="false"
LDAP_PORT="5000"

# -----------------------------------------------
# Seekink E-Ink Display System (separate docker-compose)
# -----------------------------------------------
# Port 8080 = Seekink Admin Web UI (Java)
# Port 8003 = Seekink TCP Communication (base station)
# Port 1883 = MQTT Broker (base station communication)
SEEKINK_ENABLED="true"
SEEKINK_JAVA_PORT="8080"
SEEKINK_TCP_PORT="8003"
SEEKINK_MQTT_PORT="1883"

# Seekink Device Subnet
# Change 'any' to the specific subnet where the E-Ink base stations live.
SEEKINK_VLAN="any"

# -----------------------------------------------
# Swoole Internal Port
# -----------------------------------------------
# Port 88 = Laravel Octane/Swoole (internal only, accessed via Nginx reverse proxy)
# This should NEVER be exposed externally. The firewall script blocks it automatically.
SWOOLE_PORT="88"

# -----------------------------------------------
# Docker Restart
# -----------------------------------------------
# Set to true to automatically restart Docker after applying rules
# (Required for the DOCKER-USER chain to take effect)
RESTART_DOCKER="true"
