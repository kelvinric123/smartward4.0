# =============================================================================
# Smartward Log Forwarding Configuration
# =============================================================================

# The IP address of the remote designated log server / SIEM (e.g. LogRhythm)
# Leave blank to disable forwarding.
SIEM_IP="172.18.40.242"

# The port of the remote designated log server (default is 514)
SIEM_PORT="514"

# Protocol to use: "udp" or "tcp" (default is udp)
# Note: UDP is standard for SIEM syslog input.
SIEM_PROTOCOL="udp"

# -----------------------------------------------
# Log File Sources (Host paths of Docker volumes)
# -----------------------------------------------

# Host path to Laravel Octane error log
OCTANE_LOG_PATH="/var/lib/docker/volumes/smartward_logs/_data/supervisor/octane-error.log"

# Host path to MySQL/MariaDB error log
MYSQL_LOG_PATH="/var/lib/docker/volumes/smartward_logs/_data/supervisor/mysql-error.log"
