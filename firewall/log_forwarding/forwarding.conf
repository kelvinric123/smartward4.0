# =============================================================================
# Smartward Log Forwarding Configuration
# =============================================================================

# The IP address of the remote designated log server / SIEM (e.g. Splunk)
# Leave blank to disable forwarding.
SIEM_IP="172.18.40.242"

# The port of the remote designated log server (default is 514)
SIEM_PORT="514"

# Protocol to use: "udp" or "tcp" (default is udp)
# NOTE: This MUST match the receiver's syslog input on the SIEM side.
#       If Splunk's 514 input is defined as TCP, set this to "tcp" or nothing
#       will arrive even though packets leave this host.
SIEM_PROTOCOL="udp"

# -----------------------------------------------------------------------------
# Log Sources
# -----------------------------------------------------------------------------
# The Docker volume that holds the container's logs (mounted at /var/log inside
# the smartward container). The installer resolves this to an absolute host
# path automatically via `docker volume inspect`, so you do NOT hardcode the
# /var/lib/docker/volumes/... path here.
LOG_VOLUME_NAME="docker_swoole_smartward_logs"

# Log files to forward, RELATIVE to the volume's _data directory.
# These point at the REAL, actively-written logs (not the empty supervisor
# stderr-capture stubs, which stay 0 bytes unless a process crashes).
APP_LOG_REL="supervisor/octane.log"
DB_LOG_REL="mysql/error.log"
