# =============================================================================
# Docker Compose - Seekink E-Ink Display Admin System
# Pre-built image from Docker Hub: q546877436/seekink-ubuntu:1.0.2
# =============================================================================

services:
  seekink-admin:
    image: q546877436/seekink-ubuntu:1.0.2
    container_name: smartward4-seekink
    restart: unless-stopped
    env_file:
      - seekink.env
    ports:
      # Java Port (Web Admin Interface) - Using 8088 since 8080 is in use
      - "${SEEKINK_JAVA_PORT:-8088}:8080"
      # TCP Port (Device Communication)
      - "${SEEKINK_TCP_PORT:-8003}:8003"
      # MQTT Port (Optional - for base stations supporting MQTT)
      - "${SEEKINK_MQTT_PORT:-1883}:1883"
    # Environment variables are loaded from seekink.env via env_file
    # SERVER_IP, HOST_PORT, and MQTT_ENABLE are set there directly
    volumes:
      # Persist Seekink data and configurations
      - seekink_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: "${SEEKINK_CPU_LIMIT:-2}"
          memory: "${SEEKINK_MEMORY_LIMIT:-1G}"
        reservations:
          cpus: "0.5"
          memory: "256M"
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
        tag: "smartward4-seekink"

volumes:
  seekink_data:
    driver: local

networks:
  default:
    name: smartward-network
    external: true
