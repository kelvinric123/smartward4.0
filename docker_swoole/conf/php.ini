; =============================================================================
; PHP Production Configuration for Laravel Octane/Swoole
; =============================================================================

[PHP]
; Basic Settings
engine = On
short_open_tag = Off
precision = 14
output_buffering = 4096
zlib.output_compression = Off
implicit_flush = Off
serialize_precision = -1
disable_functions = 
disable_classes =
zend.enable_gc = On
zend.exception_ignore_args = On
zend.exception_string_param_max_len = 0

; Error Handling (Production)
expose_php = Off
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT
display_errors = Off
display_startup_errors = Off
log_errors = On
log_errors_max_len = 1024
ignore_repeated_errors = Off
ignore_repeated_source = Off
report_memleaks = On
error_log = /var/log/php_errors.log

; Resource Limits (aggressive)
max_execution_time = 60
max_input_time = 120
max_input_vars = 5000
memory_limit = 512M

; File Uploads
file_uploads = On
upload_max_filesize = 64M
max_file_uploads = 20
post_max_size = 64M

; Data Handling
default_socket_timeout = 60
request_order = "GP"
variables_order = "GPCS"
register_argc_argv = Off
auto_globals_jit = On

; Paths and Directories
include_path = ".:/usr/local/lib/php"

; Date
date.timezone = UTC

; Session (handled by Redis)
session.save_handler = redis
session.save_path = "tcp://127.0.0.1:6379"
session.use_strict_mode = 1
session.use_cookies = 1
session.use_only_cookies = 1
session.name = SMARTWARD_SESSION
session.auto_start = 0
session.cookie_lifetime = 0
session.cookie_path = /
session.cookie_domain =
session.cookie_httponly = 1
session.cookie_samesite = Lax
session.cookie_secure = 0
session.serialize_handler = php_serialize
session.gc_probability = 1
session.gc_divisor = 1000
session.gc_maxlifetime = 1440
session.cache_limiter = nocache
session.cache_expire = 180
session.use_trans_sid = 0
session.sid_length = 48
session.sid_bits_per_character = 6

; Realpath Cache (aggressive)
realpath_cache_size = 8192K
realpath_cache_ttl = 3600

; =============================================================================
; OPCache Configuration (Aggressive for Swoole Performance)
; =============================================================================
[opcache]
opcache.enable = 1
opcache.enable_cli = 1
opcache.memory_consumption = 512
opcache.interned_strings_buffer = 64
opcache.max_accelerated_files = 50000
opcache.max_wasted_percentage = 5
opcache.validate_timestamps = 0
opcache.revalidate_freq = 0
opcache.fast_shutdown = 1
opcache.enable_file_override = 1
opcache.save_comments = 1
opcache.file_cache = /tmp/opcache
opcache.file_cache_only = 0
opcache.file_cache_consistency_checks = 0
opcache.huge_code_pages = 1
opcache.jit = 1255
opcache.jit_buffer_size = 256M
opcache.preload = /app/bootstrap/cache/opcache-preload.php
opcache.preload_user = www

; =============================================================================
; Swoole Extension Configuration (Aggressive)
; =============================================================================
[swoole]
swoole.enable_coroutine = On
swoole.enable_preemptive_scheduler = On
swoole.display_errors = Off
swoole.use_shortname = Off
swoole.unixsock_buffer_size = 16777216

; =============================================================================
; Redis Extension Configuration
; =============================================================================
[redis]
redis.session.locking_enabled = 1
redis.session.lock_retries = 20
redis.session.lock_wait_time = 20000

; =============================================================================
; MySQLi Configuration
; =============================================================================
[mysqli]
mysqli.max_persistent = 10
mysqli.allow_persistent = On
mysqli.max_links = -1
mysqli.default_socket =
mysqli.reconnect = Off






