# =============================================================================
# Docker Compose - Laravel Swoole Production
# Single container with PHP-Swoole, MySQL, Redis
# =============================================================================

services:
  smartward:
    build:
      context: ..
      dockerfile: docker_swoole/Dockerfile
      args:
        SWOOLE_VERSION: "5.1.1"
        MYSQL_ROOT_PASSWORD: "smartward_secret"
        REDIS_MAXMEMORY: "256mb"
    container_name: smartward-app
    restart: unless-stopped
    ports:
      - "80:80"
      - "3307:3306"
      - "6380:6379"
    environment:
      # Application - APP_KEY will be auto-generated by entrypoint.sh
      APP_NAME: "QMed_Smart_Ward4.0"
      APP_ENV: "production"
      APP_DEBUG: "false"
      APP_URL: "http://localhost"
      APP_LOCALE: "en"
      APP_FALLBACK_LOCALE: "en"
      APP_FAKER_LOCALE: "en_US"
      APP_MAINTENANCE_DRIVER: "file"
      BCRYPT_ROUNDS: "12"
      
      # Octane/Swoole
      OCTANE_SERVER: "swoole"
      OCTANE_WORKERS: "auto"
      OCTANE_TASK_WORKERS: "auto"
      OCTANE_MAX_REQUESTS: "1000"
      
      # Database (internal MySQL)
      DB_CONNECTION: "mysql"
      DB_HOST: "127.0.0.1"
      DB_PORT: "3306"
      DB_DATABASE: "smartward"
      DB_USERNAME: "root"
      DB_PASSWORD: "smartward_secret"
      
      # Redis (internal)
      REDIS_CLIENT: "phpredis"
      REDIS_HOST: "127.0.0.1"
      REDIS_PORT: "6379"
      REDIS_PASSWORD: "null"
      
      # Session & Cache via Redis
      SESSION_DRIVER: "redis"
      SESSION_LIFETIME: "120"
      SESSION_ENCRYPT: "false"
      SESSION_PATH: "/"
      CACHE_STORE: "redis"
      QUEUE_CONNECTION: "redis"
      BROADCAST_CONNECTION: "log"
      FILESYSTEM_DISK: "local"
      
      # Logging
      LOG_CHANNEL: "stack"
      LOG_STACK: "single"
      LOG_DEPRECATIONS_CHANNEL: "null"
      LOG_LEVEL: "warning"
      
      # Mail
      MAIL_MAILER: "log"
    volumes:
      # Persistent data
      - smartward_mysql:/var/lib/mysql
      - smartward_redis:/var/lib/redis
      - smartward_storage:/app/storage
      # Optional: mount logs for debugging
      - smartward_logs:/var/log
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: "2G"
        reservations:
          cpus: "0.5"
          memory: "512M"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  smartward_mysql:
    driver: local
  smartward_redis:
    driver: local
  smartward_storage:
    driver: local
  smartward_logs:
    driver: local

networks:
  default:
    name: smartward-network
    driver: bridge

