# =============================================================================
# Docker Compose - Laravel Swoole Production
# Single container with PHP-Swoole, MySQL, Redis
# =============================================================================

services:
  smartward:
    build:
      context: ..
      dockerfile: docker_swoole/Dockerfile
      args:
        SWOOLE_VERSION: "5.1.1"
        MYSQL_ROOT_PASSWORD: "${DB_PASSWORD:-smartward_secret}"
        REDIS_MAXMEMORY: "1gb"
    container_name: smartward4
    restart: unless-stopped
    # Load environment from docker.env file (tracked in git)
    env_file:
      - docker.env
    ports:
      - "${APP_PORT:-80}:80"
      - "${DB_PORT:-3307}:3306"
      - "${REDIS_PORT:-6380}:6379"
    environment:
      # Application (APP_KEY comes from env_file)
      APP_NAME: "${APP_NAME:-SmartWard}"
      APP_ENV: "${APP_ENV:-production}"
      APP_DEBUG: "${APP_DEBUG:-false}"
      APP_URL: "${APP_URL:-http://localhost}"
      
      # Octane/Swoole (Aggressive settings)
      OCTANE_SERVER: "swoole"
      OCTANE_WORKERS: "${OCTANE_WORKERS:-16}"
      OCTANE_TASK_WORKERS: "${OCTANE_TASK_WORKERS:-16}"
      OCTANE_MAX_REQUESTS: "${OCTANE_MAX_REQUESTS:-500}"
      
      # Database (internal MySQL)
      DB_CONNECTION: "mysql"
      DB_HOST: "127.0.0.1"
      DB_PORT: "3306"
      DB_DATABASE: "${DB_DATABASE:-smartward}"
      DB_USERNAME: "${DB_USERNAME:-root}"
      DB_PASSWORD: "${DB_PASSWORD:-smartward_secret}"
      
      # Redis (internal)
      REDIS_HOST: "127.0.0.1"
      REDIS_PORT: "6379"
      REDIS_PASSWORD: "${REDIS_PASSWORD:-null}"
      
      # Session & Cache via Redis
      SESSION_DRIVER: "redis"
      SESSION_LIFETIME: "120"
      CACHE_STORE: "redis"
      QUEUE_CONNECTION: "redis"
      
      # Logging
      LOG_CHANNEL: "stack"
      LOG_LEVEL: "${LOG_LEVEL:-warning}"
    volumes:
      # Persistent data
      - smartward_mysql:/var/lib/mysql
      - smartward_redis:/var/lib/redis
      - smartward_storage:/app/storage
      # Optional: mount logs for debugging
      - smartward_logs:/var/log
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: "${DOCKER_CPU_LIMIT:-8}"
          memory: "${DOCKER_MEMORY_LIMIT:-8G}"
        reservations:
          cpus: "2"
          memory: "2G"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  smartward_mysql:
    driver: local
  smartward_redis:
    driver: local
  smartward_storage:
    driver: local
  smartward_logs:
    driver: local

networks:
  default:
    name: smartward-network
    driver: bridge

