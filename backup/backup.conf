# =============================================================================
# Smartward Backup Configuration
# =============================================================================

# Where backups will be stored on the server
# Default: /var/backups/smartward
BACKUP_DIR="/var/backups/smartward"

# How many days to keep backups before deleting them
RETENTION_DAYS=7

# Database Configuration
DB_CONTAINER="smartward4"
DB_USER="root"

# Automatically pull the password from your docker.env file
DOCKER_ENV_FILE="../docker_swoole/docker.env"

# Time to run the backup (used by the deploy script)
# Default: 2:00 AM every day
CRON_SCHEDULE="0 2 * * *"
