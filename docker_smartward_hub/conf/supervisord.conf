; =============================================================================
; Supervisor Configuration - Laravel Swoole Production
; Manages MySQL, Redis, and Swoole workers in single container
; =============================================================================

[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisor/supervisord.pid
childlogdir=/var/log/supervisor
logfile_maxbytes=10MB
logfile_backups=3
loglevel=info

[unix_http_server]
file=/var/run/supervisor/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///var/run/supervisor/supervisor.sock

; =============================================================================
; MySQL Service (MariaDB on Alpine)
; =============================================================================
[program:mysql]
command=/usr/bin/mariadbd --user=mysql --datadir=/var/lib/mysql --socket=/var/run/mysqld/mysqld.sock --port=3306
user=root
autostart=true
autorestart=true
priority=10
startsecs=5
startretries=5
stopwaitsecs=30
stdout_logfile=/var/log/supervisor/mysql.log
stderr_logfile=/var/log/supervisor/mysql-error.log
stdout_logfile_maxbytes=5MB
stderr_logfile_maxbytes=5MB

; =============================================================================
; Redis Service
; =============================================================================
[program:redis]
command=/usr/bin/redis-server /etc/redis.conf
user=redis
autostart=true
autorestart=true
priority=20
startsecs=5
startretries=3
stopwaitsecs=10
stdout_logfile=/var/log/supervisor/redis.log
stderr_logfile=/var/log/supervisor/redis-error.log
stdout_logfile_maxbytes=5MB
stderr_logfile_maxbytes=5MB

; =============================================================================
; Nginx Service - SSL termination (ports 80/443)
; =============================================================================
[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
user=root
autostart=true
autorestart=true
priority=30
startsecs=5
startretries=3
stopwaitsecs=10
stdout_logfile=/var/log/supervisor/nginx.log
stderr_logfile=/var/log/supervisor/nginx-error.log
stdout_logfile_maxbytes=5MB
stderr_logfile_maxbytes=5MB

; =============================================================================
; Laravel Octane (Swoole) - Main HTTP Server
; Note: Octane auto-detects workers based on CPU when not specified
; =============================================================================
[program:octane]
command=/bin/bash -c "php /app/artisan octane:start --server=swoole --host=0.0.0.0 --port=88 --workers=${OCTANE_WORKERS:-4} --task-workers=${OCTANE_TASK_WORKERS:-4} --max-requests=${OCTANE_MAX_REQUESTS:-1000}"
user=www
autostart=true
autorestart=true
priority=100
startsecs=10
startretries=5
stopwaitsecs=30
; Restart worker if it runs too long (slow worker protection)
stopasgroup=true
killasgroup=true
stdout_logfile=/var/log/supervisor/octane.log
stderr_logfile=/var/log/supervisor/octane-error.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
stdout_logfile_backups=5
stderr_logfile_backups=5

; =============================================================================
; Laravel Queue Worker (using Redis) - Aggressive settings
; =============================================================================
[program:queue-worker]
command=php /app/artisan queue:work redis --sleep=1 --tries=3 --max-jobs=1000 --max-time=3600 --memory=256
user=www
autostart=true
autorestart=true
priority=200
numprocs=4
process_name=%(program_name)s_%(process_num)02d
startsecs=5
startretries=3
stopwaitsecs=60
stopasgroup=true
killasgroup=true
stdout_logfile=/var/log/supervisor/queue-worker.log
stderr_logfile=/var/log/supervisor/queue-worker-error.log
stdout_logfile_maxbytes=5MB
stderr_logfile_maxbytes=5MB

; =============================================================================
; Laravel Scheduler (Cron replacement)
; =============================================================================
[program:scheduler]
command=/bin/bash -c "while true; do php /app/artisan schedule:run --verbose --no-interaction; sleep 60; done"
user=www
autostart=true
autorestart=true
priority=300
startsecs=5
startretries=3
stdout_logfile=/var/log/supervisor/scheduler.log
stderr_logfile=/var/log/supervisor/scheduler-error.log
stdout_logfile_maxbytes=5MB
stderr_logfile_maxbytes=5MB

; =============================================================================
; Process Groups
; =============================================================================
[group:services]
programs=mysql,redis,nginx

[group:laravel]
programs=octane,queue-worker,scheduler

; =============================================================================
; Event Listeners for Process Management
; Note: Removed the process_exit listener as it requires a proper event
; listener script that follows the supervisor event protocol.
; =============================================================================

